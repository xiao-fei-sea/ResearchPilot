# P0 阶段：先提供 mysql + redis（开发/冒烟必需）
# api / worker / frontend 服务在 P0-6 补全

services:
  mysql:
    image: mysql:8.4
    container_name: researchpilot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: researchpilot
      MYSQL_USER: researchpilot
      MYSQL_PASSWORD: researchpilot
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: researchpilot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
